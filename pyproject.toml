[project]
name = "eviforge"
version = "0.4.0"
description = "Evidence-driven, risk-aware and evolvable terminal coding agent"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
]

[project.scripts]
eviforge = "mewcode.__main__:main"
mewcode = "mewcode.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mewcode"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jsonschema>=4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
