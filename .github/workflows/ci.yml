name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-mcp-regression:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.8
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Verify MCP and original runtime on Windows without credentials
        run: uv run --no-sync python -m pytest -q tests/test_mcp_integrations.py tests/test_plan_capabilities.py tests/test_plan_surfaces.py tests/test_document_runtime.py tests/test_worktree.py tests/test_dag.py

  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.11.8
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run offline tests
        run: uv run --no-sync python -m pytest -q
      - name: Verify SubAgent components
        run: uv run --no-sync python tests/verify_subagent.py
      - name: Build distributions
        run: uv build --no-sources
      - name: Install and verify the wheel outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/eviforge-requirements.txt"
          uv venv --python 3.11 "$RUNNER_TEMP/eviforge-wheel"
          uv pip install --python "$RUNNER_TEMP/eviforge-wheel/bin/python" --require-hashes -r "$RUNNER_TEMP/eviforge-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/eviforge-wheel/bin/python" --no-deps dist/*.whl
          "$RUNNER_TEMP/eviforge-wheel/bin/python" scripts/check_distribution.py
